name: Upstream request
description: For upstream maintainers. Ask us to rename, remove, or stop something.
title: "[upstream] "
labels: ["upstream-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reaching out, and sorry for the trouble. Whatever you ask
        here about names, mentions, or contact, we do without argument
        (Decree X). You don't need to justify the request.

  - type: input
    id: project
    attributes:
      label: Your project
      placeholder: https://github.com/owner/project
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: What should we change?
    validations:
      required: true
